<div class="merchandising">
  <header class="merchandising-hero">
    <p class="merchandising-hero__eyebrow">{{ 'shop.merchandising.eyebrow' | translate }}</p>
    <h1 class="title">{{ 'shop.merchandising.title' | translate }}</h1>
    <p class="merchandising-hero__description">{{ 'shop.merchandising.description' | translate }}</p>
  </header>

  <app-product-list
    [products]="products"
    detailRoutePrefix="/tienda-boutique/merchandising"
    priceDigits="1.2-2"
    [emptyKey]="'shop.merchandising.empty'"
  />
</div>
