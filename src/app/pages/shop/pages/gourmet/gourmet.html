<div class="gourmet">
  <header class="gourmet-hero">
    <p class="gourmet-hero__eyebrow">{{ 'shop.gourmet.eyebrow' | translate }}</p>
    <h1 class="title">{{ 'shop.gourmet.title' | translate }}</h1>
    <p class="gourmet-hero__description">{{ 'shop.gourmet.description' | translate }}</p>
  </header>

  <app-product-list
    [products]="products"
    detailRoutePrefix="/tienda-boutique/gourmet"
    priceDigits="1.2-2"
  />
</div>
