<div class="home">
  <div class="home-hero__content">
    <h1 class="title">{{ 'home.title' | translate }}</h1>
  </div>

  <section class="home-video" [attr.aria-label]="'home.videoAria' | translate">
    <div class="home-video__frame">
      <video
        class="home-video__player"
        [src]="videoPath"
        [attr.aria-label]="'home.videoTitle' | translate"
        autoplay
        muted
        playsinline
        controls
        preload="auto"
      ></video>
    </div>
  </section>

  <app-banner [slides]="slides" />
</div>
