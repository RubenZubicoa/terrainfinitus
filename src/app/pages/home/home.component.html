<div class="home">
  <div class="home-hero__content">
    <h1 class="title">{{ 'home.title' | translate }}</h1>
  </div>

  <section class="home-video" [attr.aria-label]="'home.videoAria' | translate">
    <div class="home-video__frame">
      <iframe
        class="home-video__player"
        [src]="safeVideoPath"
        [title]="'home.videoTitle' | translate"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
  </section>

  <app-banner [slides]="slides" />
</div>
