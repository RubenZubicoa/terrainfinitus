@let pdf = safePdfPath();
@let label = pdfLabel();
<div class="pdf-viewer" [attr.aria-label]="label">
  <p class="pdf-viewer__label">{{ label }}</p>
  <iframe
    class="pdf-viewer__frame"
    [src]="pdf"
    [title]="label"
    loading="lazy"
  ></iframe>
  <a
    class="pdf-viewer__open link"
    [href]="pdfPath()"
    target="_blank"
    rel="noopener noreferrer"
  >
    {{ label }}
  </a>
</div>
