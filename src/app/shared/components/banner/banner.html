<section class="banner" [attr.aria-label]="galleryAriaKey() | translate">
  <div class="banner__viewport" aria-live="polite">
    @for (slide of slides(); track slide.src; let i = $index) {
      <figure
        class="banner__slide"
        [class.banner__slide--active]="currentIndex() === i"
        [attr.aria-hidden]="currentIndex() !== i"
      >
        <img
          [src]="slide.src"
          [alt]="slide.altKey | translate"
          loading="lazy"
          decoding="async"
        />
      </figure>
    }

    @if (slides().length > 1) {
      <div class="banner__controls">
        <button
          type="button"
          class="banner__nav banner__nav--prev"
          [attr.aria-label]="prevAriaKey() | translate"
          (click)="prevSlide()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
        <button
          type="button"
          class="banner__nav banner__nav--next"
          [attr.aria-label]="nextAriaKey() | translate"
          (click)="nextSlide()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
      </div>
    }
  </div>

  @if (slides().length > 1) {
    <div class="banner__thumbs" role="list" [attr.aria-label]="galleryAriaKey() | translate">
      @for (slide of slides(); track slide.src; let i = $index) {
        <button
          type="button"
          class="banner__thumb"
          role="listitem"
          [class.banner__thumb--active]="currentIndex() === i"
          [attr.aria-current]="currentIndex() === i ? 'true' : null"
          [attr.aria-label]="slide.altKey | translate"
          (click)="goToSlide(i)"
        >
          <img [src]="slide.src" [alt]="slide.altKey | translate" loading="lazy" />
        </button>
      }
    </div>
  }
</section>
