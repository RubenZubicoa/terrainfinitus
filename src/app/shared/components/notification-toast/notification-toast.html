@if (notificationService.notification(); as notification) {
  <div
    class="toast"
    [class.toast--info]="notification.type === 'info'"
    [class.toast--success]="notification.type === 'success'"
    [class.toast--error]="notification.type === 'error'"
    role="status"
    aria-live="polite"
  >
    <p class="toast__message">{{ notification.messageKey | translate }}</p>
    <button
      type="button"
      class="toast__close"
      [attr.aria-label]="'common.close' | translate"
      (click)="dismiss()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>
  </div>
}
